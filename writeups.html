<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Writeups Archive | 🛡️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #07080d;
            --card: #0f111a;
            --border: rgba(255, 255, 255, 0.06);
            --accent: #00f2ff;
            --text: #f0f1f5;
            --text-secondary: #9aa0b9;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        .page-header h1 { font-size: 2rem; font-weight: 800; margin: 0; }
        .page-header p { color: var(--text-secondary); margin-top: 8px; }
        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover { text-decoration: underline; }
        
        .task-item {
            background: rgba(0,242,255,0.05);
            border: 1px solid rgba(0,242,255,0.1);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .task-item:hover {
            background: rgba(0,242,255,0.08);
            border-color: rgba(0,242,255,0.3);
        }
        .link-url {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .link-url:hover { color: var(--accent); }
        .copy-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .copy-btn:hover { background: #fff; }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin-top: 20px;
        }
        .page-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>

    <div class="container">

            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portal</a>
        </div>
        
        <div id="writeups-container">

        </div>
        
        <div class="pagination">

        </div>
    </div>

            const end = start + itemsPerPage;
            const items = allWriteups.slice(start, end);

                </div>`;
            });

            document.getElementById('page-info').innerText = `Page ${currentPage} of ${totalPages}`;

            document.getElementById('next-btn').disabled = currentPage === totalPages;

        function changePage(dir) {
            const totalPages = Math.ceil(allWriteups.length / itemsPerPage);
            currentPage += dir;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            render();
            window.scrollTo(0, 0);
        }
