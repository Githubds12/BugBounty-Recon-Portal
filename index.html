<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Bounty Intelligence Portal | 🛡️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0b10;
            --card: #15171e;
            --accent: #00f2ff;
            --text: #e0e0e0;
            --secondary: #888;
            --danger: #ff4d4d;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--card);
            border-right: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 30px;
        }

        .nav-item {
            padding: 12px;
            border-radius: 8px;
            color: var(--secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(0, 242, 255, 0.1);
            color: var(--accent);
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        .view { display: none; flex-direction: column; gap: 20px; flex: 1; overflow-y: auto; }
        .view.active { display: flex; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .stat-val { font-size: 2.2rem; font-weight: 800; color: var(--accent); margin: 10px 0; }

        /* Report List */
        .report-item {
            background: #1a1c23;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .report-item:hover { border-color: var(--accent); }

        /* Console */
        .console-box {
            height: 300px;
            background: #000;
            border-radius: 12px;
            border: 1px solid #333;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #00ff00;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.1);
        }

        .btn-launch {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        input {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            width: 300px;
        }

        /* Report Overlay */
        #report-overlay {
            position: fixed;
            top: 50px;
            left: 280px;
            right: 50px;
            bottom: 50px;
            background: #111;
            border: 1px solid var(--accent);
            z-index: 100;
            display: none;
            padding: 30px;
            overflow-y: auto;
            white-space: pre-wrap;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo" style="color: var(--accent); font-size: 1.2rem; font-weight: 900; margin-bottom: 40px;">
            <i class="fas fa-vault"></i> RECON VAULT
        </div>
        <div class="nav-item active" onclick="showView('reports')">
            <i class="fas fa-archive"></i> Intelligence Archive
        </div>
        
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #222; text-align: center;">
            <p style="font-size: 0.6rem; color: #555;">LOCAL-FIRST ARCHIVE v2.0</p>
        </div>
    </div>

    <div class="main">
        <!-- VIEW: REPORTS (PRIMARY) -->
        <div id="view-reports" class="view active">
            <div class="stats-header" style="margin-bottom: 30px;">
                <div>
                    <h1>Intelligence Archive</h1>
                    <p>Centralized vault for all reconnaissance dossiers and local research.</p>
                </div>
                <div style="display:flex; gap:10px">
                    <button class="btn btn-primary" onclick="document.getElementById('fileUplink').click()" style="background:var(--accent); color:#000; border:none; padding:12px 25px; border-radius:8px; font-weight:800; cursor:pointer;">
                        <i class="fas fa-upload"></i> UPLINK INTELLIGENCE
                    </button>
                    <input type="file" id="fileUplink" style="display: none;" onchange="handleUplink(this)">
                    <button class="btn btn-danger" onclick="purgeArchive()" style="background:var(--danger); color:white; border:none; padding:12px 15px; border-radius:8px; font-weight:800; cursor:pointer;">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            
            <div id="report-list" style="margin-top: 20px;">Loading Archive...</div>
        </div>
    </div>

    <div id="report-overlay">
        <button onclick="document.getElementById('report-overlay').style.display='none'" style="float:right; background:var(--danger); color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer">CLOSE</button>
        <div id="report-content"></div>
    </div>

    <script>
        function showView(viewId) {
            // 1. Always close the report overlay when navigating
            document.getElementById('report-overlay').style.display = 'none';
            
            // 2. Switch the active view
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const targetView = document.getElementById('view-' + viewId);
            if (targetView) targetView.classList.add('active');
            
            // 3. Update the sidebar UI
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (event && event.currentTarget && event.currentTarget.classList.contains('nav-item')) {
                event.currentTarget.classList.add('active');
            } else {
                // Fallback: find by text if triggered programmatically
                const items = document.querySelectorAll('.nav-item');
                for (let item of items) {
                    if (item.innerText.toLowerCase().includes(viewId)) {
                        item.classList.add('active');
                        break;
                    }
                }
            }
            
            // 4. Load relevant data
            if(viewId === 'reports') loadReports();
            if(viewId === 'dashboard') loadStats();
            if(viewId === 'targets') loadTargets();
        }

        async function loadStats() {
            try {
                // Run Cloud Health Check
                const healthRes = await fetch('/api/health');
                const healthData = await healthRes.json();
                const workingCount = Object.values(healthData).filter(v => v === 'OK').length;
                const totalCount = Object.keys(healthData).length;
                
                const statusEl = document.getElementById('sys-status');
                const checklistEl = document.getElementById('tool-checklist');
                
                if (workingCount === totalCount) {
                    statusEl.innerText = `READY: ${workingCount}/${totalCount} ACTIVE`;
                    statusEl.style.color = '#00ff00';
                } else {
                    statusEl.innerText = `WARNING: ${workingCount}/${totalCount} ACTIVE`;
                    statusEl.style.color = '#ffcc00';
                }

                // Populate individual tool status
                checklistEl.innerHTML = Object.entries(healthData).map(([tool, status]) => {
                    const icon = status === 'OK' ? '🟢' : '🔴';
                    const color = status === 'OK' ? '#00ff00' : '#ff4d4d';
                    return `<div style="color:${color}">${icon} ${tool.toUpperCase()}</div>`;
                }).join('');
            } catch(e) {}
        }

        async function loadReports() {
            const list = document.getElementById('report-list');
            try {
                const res = await fetch('/api/reports');
                const data = await res.json();
                list.innerHTML = `
                    <button onclick="clearArchive()" style="background:rgba(255,0,0,0.1); border:1px solid #ff4444; color:#ff4444; padding:12px; border-radius:10px; cursor:pointer; margin-bottom:20px; font-weight:bold; width:100%; font-size:0.8rem; text-transform:uppercase; letter-spacing:1px; transition:0.3s;" onmouseover="this.style.background='rgba(255,0,0,0.2)'" onmouseout="this.style.background='rgba(255,0,0,0.1)'">
                        <i class="fas fa-trash-alt"></i> PURGE INTELLIGENCE ARCHIVE
                    </button>
                ` + data.reports.map(r => {
                    const date = new Date(r.timestamp).toLocaleString();
                    const isScanning = r.filename.includes('current') || (r.subs === 0 && r.live === 0);
                    return `
                        <div class="report-item" onclick="${isScanning ? "showView('dashboard')" : `viewReport('${r.filename}')`}" style="${isScanning ? 'border-left:4px solid #ffcc00' : ''}">
                            <div style="flex:1">
                                <div style="font-weight:800; color:var(--accent)">
                                    <i class="fas fa-shield-alt"></i> ${r.target.toUpperCase()}
                                    ${isScanning ? '<span style="margin-left:10px; color:#ffcc00; font-size:0.6rem">🛰️ LIVE SCANNING</span>' : ''}
                                </div>
                                <div style="color:var(--secondary); font-size:0.75rem">${date}</div>
                            </div>
                            <div style="display:flex; gap:15px; text-align:center">
                                <div>
                                    <div style="color:var(--accent); font-weight:800">${r.subs}</div>
                                    <div style="font-size:0.6rem; color:var(--secondary)">SUBS</div>
                                </div>
                                <div>
                                    <div style="color:#00ff00; font-weight:800">${r.live}</div>
                                    <div style="font-size:0.6rem; color:var(--secondary)">LIVE</div>
                                </div>
                                <div>
                                    <div style="color:var(--danger); font-weight:800">${r.ports}</div>
                                    <div style="font-size:0.6rem; color:var(--secondary)">PORTS</div>
                                </div>
                            </div>
                            <div style="margin-left:30px; font-size:0.8rem; color:var(--accent)">
                                ${isScanning ? 'WAIT...' : 'OPEN <i class="fas fa-external-link-alt"></i>'}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { list.innerHTML = "Error loading reports."; }
        }

        async function loadTargets() {
            const list = document.getElementById('target-list');
            try {
                const res = await fetch('/api/reports');
                const data = await res.json();
                // Use the 'target' field from our new API format
                const uniqueTargets = [...new Set(data.reports.map(r => r.target))];
                list.innerHTML = uniqueTargets.map(d => `
                    <div class="card" style="text-align:center">
                        <div style="font-weight:800; color:var(--accent); font-size:1.2rem">${d.toUpperCase()}</div>
                        <div style="color:var(--secondary); margin-top:10px">Status: MONITORED</div>
                    </div>
                `).join('');
            } catch(e) { list.innerHTML = "Error loading targets."; }
        }

        async function viewReport(filename) {
            const res = await fetch('/api/report/' + filename);
            const text = await res.text();
            document.getElementById('report-content').innerText = text;
            document.getElementById('report-overlay').style.display = 'block';
        }

        function switchTab(type) {
            const scanTab = document.getElementById('tab-scan');
            const auditTab = document.getElementById('tab-audit');
            const scanLogs = document.getElementById('logs-scan');
            const auditLogs = document.getElementById('logs-audit');

            if(type === 'scan') {
                scanTab.style.background = 'rgba(0,242,255,0.2)';
                scanTab.style.border = '1px solid var(--accent)';
                scanTab.style.borderBottom = '3px solid var(--accent)';
                scanTab.style.color = 'white';
                auditTab.style.background = 'transparent';
                auditTab.style.border = '1px solid rgba(255,255,255,0.1)';
                auditTab.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
                auditTab.style.color = '#888';
                scanLogs.style.display = 'block';
                auditLogs.style.display = 'none';
            } else {
                auditTab.style.background = 'rgba(0,242,255,0.2)';
                auditTab.style.border = '1px solid var(--accent)';
                auditTab.style.borderBottom = '3px solid var(--accent)';
                auditTab.style.color = 'white';
                scanTab.style.background = 'transparent';
                scanTab.style.border = '1px solid rgba(255,255,255,0.1)';
                scanTab.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
                scanTab.style.color = '#888';
                auditLogs.style.display = 'block';
                scanLogs.style.display = 'none';
            }
        }

        async function verifyTools() {
            showView('dashboard');
            switchTab('audit');
            const logDiv = document.getElementById('logs-audit');
            logDiv.innerHTML = `[${new Date().toLocaleTimeString()}] 🧪 Initializing Live Toolchain Audit...<br>`;
            
            const eventSource = new EventSource('/api/verify_tools');
            eventSource.onmessage = (e) => {
                const entry = document.createElement('div');
                entry.innerHTML = `<span style="color:#888">[AUDIT]</span> ${e.data}`;
                logDiv.appendChild(entry);
                const box = document.getElementById('console');
                box.scrollTop = box.scrollHeight;
                
                if(e.data.includes('✅ AUDIT COMPLETE')) {
                    eventSource.close();
                }
            };
        }

        function startScan() {
            const target = document.getElementById('target').value || 'replit.com';
            const logDiv = document.getElementById('logs-scan');
            const infoDiv = document.getElementById('scan-info');
            const timerEl = document.getElementById('scan-timer');
            
            showView('dashboard');
            switchTab('scan');
            
            let seconds = 0;
            timerEl.innerText = "00:00";
            const timer = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerEl.innerText = `${mins}:${secs}`;
            }, 1000);

            infoDiv.style.display = 'block';
            logDiv.innerHTML = `[${new Date().toLocaleTimeString()}] 🚀 Launching cloud engine for ${target}...<br>`;
            
            const eventSource = new EventSource(`/scan?target=${target}`);
            eventSource.onmessage = (e) => {
                const entry = document.createElement('div');
                entry.innerHTML = `<span style="color:#555">[${new Date().toLocaleTimeString()}]</span> ${e.data}`;
                logDiv.appendChild(entry);
                const box = document.getElementById('console');
                box.scrollTop = box.scrollHeight;
                
                if(e.data.includes('✅ Scan Complete')) {
                    eventSource.close();
                    clearInterval(timer);
                    infoDiv.style.display = 'none';
                    loadStats();
                }
            };
            eventSource.onerror = () => {
                eventSource.close();
                clearInterval(timer);
            };
        }

         async function handleUplink(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            addLog(`[UPLINK] 📤 Sending ${file.name} to Central Archive...`, 'info');
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert(`✅ UPLINK SUCCESS: ${file.name} is now archived.`);
                    loadHistory(); 
                } else {
                    alert(`❌ UPLINK FAILED: ${result.message}`);
                }
            } catch (error) {
                alert(`❌ NETWORK ERROR: ${error}`);
            }
        }

        function addManualTarget() {
            const target = document.getElementById('targetInput').value;
            if (!target) return;
            addLog(`[ARCHIVE] 📁 Manually logging target: ${target}`, 'info');
            // In manual mode, we just show it in logs. 
            // Real data appears once a dossier is uplinked.
            document.getElementById('targetInput').value = '';
        }

        async function clearArchive() {
            if(!confirm("⚠️ ARE YOU SURE? This will permanently delete all intelligence reports!")) return;
            await fetch('/api/reports', { method: 'DELETE' });
            loadReports();
            loadStats();
        }

        async function checkActiveMissions() {
            try {
                const res = await fetch('/api/active_scans');
                const data = await res.json();
                if(data.active && data.active.length > 0) {
                    const target = data.active[0];
                    const logDiv = document.getElementById('logs-scan');
                    logDiv.innerHTML = `
                        <div style="background:rgba(0,242,255,0.05); border:1px solid var(--accent); padding:20px; border-radius:12px; margin-bottom:20px; animation: glow 2s infinite alternate;">
                            <h3 style="margin-top:0; color:var(--accent); display:flex; align-items:center; gap:10px;">
                                <i class="fas fa-satellite"></i> MISSION RE-ATTACHMENT
                            </h3>
                            <p style="color:white; margin-bottom:15px;">A reconnaissance mission for <b style="color:var(--accent)">${target}</b> is already in progress in the cloud.</p>
                            <p style="font-size:0.85rem; color:var(--secondary); line-height:1.6;">
                                Live log streaming was interrupted by a browser refresh. The mission is continuing independently in the background. 
                                Full intelligence will be available in the <b>Archive</b> upon completion.
                            </p>
                            <button onclick="location.reload()" style="background:var(--accent); border:none; color:black; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:800; margin-top:10px; width:100%; transition:0.3s;">
                                CHECK MISSION STATUS
                            </button>
                        </div>
                    `;
                    document.getElementById('scan-info').style.display = 'block';
                    switchTab('scan');
                }
            } catch(e) {}
        }

        loadStats();
        checkActiveMissions();
    </script>
</body>
</html>
